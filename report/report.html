<style>
/* ============ Tokens ============ */
:root{
  --ink:#182420;
  --ink-soft:#4b5a53;
  --paper:#f4f6f2;
  --surface:#ffffff;
  --surface-2:#eef1ea;
  --line:#dde2d9;
  --line-strong:#c3ccbf;
  --stale:#b8631f;
  --stale-bg:#fbeee0;
  --stale-ink:#7a4315;
  --fixed:#1f7a5c;
  --fixed-bg:#e4f3ec;
  --fixed-ink:#175c46;
  --accent:#2f5f52;
  --shadow: 0 1px 2px rgba(24,36,32,.06), 0 6px 20px -8px rgba(24,36,32,.12);
  --radius: 10px;
  --font-display:'IBM Plex Sans KR','IBM Plex Sans',-apple-system,sans-serif;
  --font-body:'IBM Plex Sans KR','IBM Plex Sans',-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono','IBM Plex Sans KR',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e7ece7;
    --ink-soft:#a9b6ac;
    --paper:#141a17;
    --surface:#1b2320;
    --surface-2:#212a26;
    --line:#2c3733;
    --line-strong:#3a463f;
    --stale:#e0894a;
    --stale-bg:#3a2716;
    --stale-ink:#f0b17e;
    --fixed:#4fbf94;
    --fixed-bg:#153428;
    --fixed-ink:#8fd9bb;
    --accent:#6fb39d;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -10px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --ink:#e7ece7;
  --ink-soft:#a9b6ac;
  --paper:#141a17;
  --surface:#1b2320;
  --surface-2:#212a26;
  --line:#2c3733;
  --line-strong:#3a463f;
  --stale:#e0894a;
  --stale-bg:#3a2716;
  --stale-ink:#f0b17e;
  --fixed:#4fbf94;
  --fixed-bg:#153428;
  --fixed-ink:#8fd9bb;
  --accent:#6fb39d;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -10px rgba(0,0,0,.5);
}

/* ============ Base ============ */
*{box-sizing:border-box;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.65;
  padding:0 20px;
}
h1,h2,h3,h4{
  font-family:var(--font-display);
  font-weight:700;
  text-wrap:balance;
  color:var(--ink);
  margin:0;
}
p{margin:0 0 12px;}
p:last-child{margin-bottom:0;}
a{color:var(--accent);}
code, .mono{font-family:var(--font-mono);}
::selection{background:var(--fixed-bg);color:var(--fixed-ink);}

.shell{
  max-width:1180px;
  margin:0 auto;
  display:flex;
  gap:28px;
  padding-block:28px 64px;
  align-items:flex-start;
}

/* ============ Sidebar ============ */
.sidebar{
  width:260px;
  flex:none;
  position:sticky;
  top:20px;
}
.report-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--fixed-ink);
  background:var(--fixed-bg);
  border:1px solid var(--fixed);
  border-radius:99px;
  padding:4px 10px;
  margin-bottom:14px;
}
.report-badge::before{content:"●";font-size:8px;color:var(--fixed);}
.masthead h1{font-size:22px;line-height:1.25;margin-bottom:8px;}
.masthead .sub{color:var(--ink-soft);font-size:13.5px;line-height:1.5;margin-bottom:16px;}
.meta-list{
  list-style:none;padding:0;margin:0 0 20px;
  border-top:1px solid var(--line);
  font-size:12.5px;
}
.meta-list li{
  display:flex;justify-content:space-between;gap:10px;
  padding:7px 0;border-bottom:1px solid var(--line);color:var(--ink-soft);
}
.meta-list b{color:var(--ink);font-weight:600;text-align:right;}

nav.tabs{
  display:flex;flex-direction:column;gap:2px;
  border-top:1px solid var(--line-strong);
  padding-top:10px;
}
nav.tabs button{
  all:unset;
  display:flex;
  align-items:baseline;
  gap:10px;
  padding:9px 10px;
  border-radius:8px;
  cursor:pointer;
  font-size:13.5px;
  color:var(--ink-soft);
  transition:background .12s ease, color .12s ease;
}
nav.tabs button:hover{background:var(--surface-2);color:var(--ink);}
nav.tabs button .n{
  font-family:var(--font-mono);
  font-size:11px;
  color:var(--ink-soft);
  min-width:16px;
}
nav.tabs button[aria-selected="true"]{
  background:var(--surface);
  color:var(--ink);
  font-weight:600;
  box-shadow:var(--shadow);
}
nav.tabs button[aria-selected="true"] .n{color:var(--accent);}

/* ============ Content ============ */
.content{flex:1;min-width:0;}
.panel{display:none;}
.panel[data-active="true"]{display:block;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

.panel-head{margin-bottom:20px;}
.panel-head .eyebrow{
  font-family:var(--font-mono);font-size:11.5px;letter-spacing:.05em;
  color:var(--accent);text-transform:uppercase;margin-bottom:6px;display:block;
}
.panel-head h2{font-size:25px;margin-bottom:8px;}
.panel-head .q{color:var(--ink-soft);font-size:14.5px;max-width:64ch;}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px 22px;
  margin-bottom:16px;
}
.card > h3{font-size:15.5px;margin-bottom:10px;}
.card > h3 .tag{margin-left:8px;}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:760px){.grid-2{grid-template-columns:1fr;}}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
th{font-family:var(--font-mono);font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;}
tr:last-child td{border-bottom:none;}
.tbl-wrap{overflow-x:auto;}

.tag{
  display:inline-flex;align-items:center;gap:4px;
  font-family:var(--font-mono);font-size:11px;font-weight:600;
  padding:2px 8px;border-radius:99px;white-space:nowrap;
}
.tag.confirmed{background:var(--fixed-bg);color:var(--fixed-ink);}
.tag.stale{background:var(--stale-bg);color:var(--stale-ink);}
.tag.neutral{background:var(--surface-2);color:var(--ink-soft);}

pre{
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:8px;
  padding:13px 15px;
  overflow-x:auto;
  font-size:12.5px;
  line-height:1.6;
  margin:10px 0;
}
pre code{font-family:var(--font-mono);color:var(--ink);}
.diff-add{color:var(--fixed-ink);}
.diff-del{color:var(--stale-ink);text-decoration:line-through;text-decoration-color:var(--stale);}

.callout{
  border-left:3px solid var(--accent);
  background:var(--surface-2);
  padding:12px 16px;
  border-radius:0 8px 8px 0;
  font-size:13.5px;
  margin:14px 0;
}
.callout.stale{border-color:var(--stale);background:var(--stale-bg);color:var(--stale-ink);}
.callout.fixed{border-color:var(--fixed);background:var(--fixed-bg);color:var(--fixed-ink);}

ol.steps, ul.plain{margin:8px 0 0;padding-left:0;list-style:none;}
ol.steps{counter-reset:step;}
ol.steps li{
  counter-increment:step;
  position:relative;
  padding-left:30px;
  margin-bottom:10px;
  font-size:13.5px;
}
ol.steps li::before{
  content:counter(step);
  position:absolute;left:0;top:0;
  width:20px;height:20px;border-radius:50%;
  background:var(--surface-2);color:var(--ink-soft);
  font-family:var(--font-mono);font-size:11px;font-weight:600;
  display:flex;align-items:center;justify-content:center;
}
ul.plain li{position:relative;padding-left:16px;margin-bottom:6px;font-size:13.5px;}
ul.plain li::before{content:"—";position:absolute;left:0;color:var(--ink-soft);}

.ref-list{list-style:none;padding:0;margin:0;}
.ref-list li{
  border-bottom:1px solid var(--line);
  padding:12px 0;
}
.ref-list li:last-child{border-bottom:none;}
.ref-list .kicker{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);}
.ref-list a{font-weight:600;text-decoration:none;}
.ref-list a:hover{text-decoration:underline;}
.ref-list .desc{color:var(--ink-soft);font-size:13px;margin-top:3px;}

figure{margin:16px 0 6px;}
figure svg{width:100%;height:auto;display:block;background:var(--surface);border:1px solid var(--line);border-radius:8px;}
figcaption{font-size:12.5px;color:var(--ink-soft);margin-top:8px;text-align:center;}

.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px;}
.kv dt{color:var(--ink-soft);font-family:var(--font-mono);font-size:11.5px;padding-top:2px;}
.kv dd{margin:0;}

@media (max-width:860px){
  .shell{flex-direction:column;}
  .sidebar{
    width:100%;position:static;
  }
  nav.tabs{
    flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px;
    -webkit-overflow-scrolling:touch;
  }
  nav.tabs button{flex:none;}
  .meta-list{display:none;}
}
</style>

<script>
const TABS = [
  {id:"cause", label:"가능한 원인과 확인 방법"},
  {id:"scope", label:"원인 범위 구분"},
  {id:"cachebuster", label:"Cache Buster 적정성"},
  {id:"sync", label:"배포 전후 동기화 절차"},
  {id:"edge", label:"Edge / VDI 권고 설정"},
  {id:"plan", label:"재발방지 방안"},
  {id:"refs", label:"관련 SAP 자료"},
  {id:"logs", label:"추가 분석 로그"},
  {id:"cookie", label:"Work Zone 쿠키/SameSite 점검"},
];

const nav = document.getElementById("tabnav");
TABS.forEach((t,i)=>{
  const b = document.createElement("button");
  b.setAttribute("role","tab");
  b.dataset.tab = t.id;
  b.innerHTML = `<span class="n">${String(i+1).padStart(2,"0")}</span><span>${t.label}</span>`;
  b.addEventListener("click", ()=>select(t.id));
  nav.appendChild(b);
});

function select(id){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===id));
  document.querySelectorAll(".panel").forEach(p=>p.dataset.active = (p.id==="panel-"+id));
  try{ localStorage.setItem("ehr-report-tab", id); }catch(e){}
  const el = document.getElementById("panel-"+id);
  if(el) el.scrollIntoView({block:"start", behavior:"instant"});
}

let initial = "cause";
try{ initial = localStorage.getItem("ehr-report-tab") || "cause"; }catch(e){}
if(!TABS.find(t=>t.id===initial)) initial = "cause";
</script>

<span class="diff-add">      "cacheControl": "no-store, no-cache, must-revalidate"</span>   // 작년에 이미 처리됨

  <div class="card">

    <p>빌드 시 각 리소스의 최종수정시각을 담은 <code>sap-ui-cachebuster-info.json</code>을 생성하고, 브라우저가 요청 경로 앞에 타임스탬프를 붙여 요청합니다. 파일이 안 바뀌면 URL이 그대로라 캐시를 재사용하고, 바뀌면 URL도 바뀌어 자동으로 새로 받습니다. <b>단, 서버가 이 타임스탬프를 떼어내고 실제 파일을 찾아주는 로직이 있어야</b> 동작합니다.</p>
  </div>

  <div class="card">
    <h3>BTP Cloud Foundry 적용 가능 여부 <span class="tag stale">공식 미지원</span></h3>
    <p>SAP 공식 문서(help.sap.com) 원문:</p>
    <pre><code>"SAPUI5 supports the application cache buster on SAP NetWeaver AS
for ABAP only. For Java apps on SAP NetWeaver AS for Java and
SAP HANA XS the application cache buster concept is not supported."</code></pre>
    <p>타임스탬프를 떼어내는 로직은 ABAP의 ICF(Internet Communication Framework) 핸들러에만 구현되어 있습니다. BTP CF의 <code>html5-apps-repo-rt</code>에는 이 로직이 없어, 활성화해도 정상 동작을 보장할 수 없습니다.</p>
    <div class="tbl-wrap">
    <table>
      <thead><tr><th></th><th>ABAP NetWeaver</th><th>BTP Cloud Foundry</th></tr></thead>
      <tbody>

        <tr><td>권장 캐싱 전략</td><td>AppCacheBuster</td><td><b>xs-app.json 명시적 cacheControl</b></td></tr>
      </tbody>
    </table>
    </div>
  </div>

  <div class="card">

    <h2>Microsoft Edge 및 VDI 환경에서 권고되는 운영 설정</h2>
    <p class="q">사내 표준 브라우저(Edge)와 VDI 환경 특성이 증상에 미치는 영향과 권고 설정입니다.</p>
  </div>

  <div class="card">
    <h3>SAPUI5는 Edge를 Chrome과 동일하게 취급합니다</h3>
    <p>SAP 공식 문서(Browser and Platform Support) 원문:</p>
    <pre><code>"SAPUI5 detects Microsoft Edge (Chromium) as Google Chrome and
treats it the same. If your organization's tracking prevention
settings within Microsoft Edge are too strict, *.hana.ondemand.com
addresses are blocked."</code></pre>
    <p>즉 "Edge라서 원래 더 잘 걸린다"는 프레임은 정확하지 않습니다. 실제로는 <b>Edge 고유의 추적 방지(Tracking Prevention)</b> 기능이 과도하게 엄격할 경우 관련 도메인 요청이 차단될 수 있다는 것이 공식적으로 문서화된 유일한 Edge 특이사항입니다.</p>
  </div>

  <div class="grid-2">
    <div class="card">
      <h3>Edge 권고 설정</h3>
      <ul class="plain">
        <li><code>edge://settings/privacy</code>에서 추적 방지 레벨 확인</li>
        <li><code>*.hana.ondemand.com</code>, 사내 BTP 서브도메인을 예외 목록에 등록 검토</li>
        <li>그룹 정책으로 캐시 크기/정책이 강제되어 있는지 IT 인프라팀 확인</li>
      </ul>
    </div>
    <div class="card">
      <h3>VDI 환경 권고</h3>
      <ul class="plain">
        <li>영속(persistent) VDI는 캐시가 세션 간 계속 누적됨 — 비영속 대비 이번 증상에 더 취약</li>
        <li>영속/비영속 여부를 사용자별로 파악해두면 재발 시 원인 추정에 도움</li>
        <li>사내 프록시/포워드 캐시 서버가 있다면 별도 캐싱 정책 확인 필요</li>
      </ul>
    </div>
  </div>

  <div class="card">
    <h3>브라우저 휴리스틱 캐싱은 엔진마다 다릅니다</h3>

  </div>
