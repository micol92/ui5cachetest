<title>캐싱 버그 조사 기록</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#1a1f2b;
  --ink-soft:#565f70;
  --paper:#eef0f3;
  --surface:#ffffff;
  --surface-2:#e4e7ec;
  --line:#d6dae1;
  --line-strong:#bcc2cc;
  --accent:#4550c4;
  --accent-bg:#e7e8fb;
  --ok:#1c8f5e;
  --ok-bg:#e0f4ea;
  --warn:#b33c1e;
  --warn-bg:#fbe9e3;
  --shadow:0 1px 2px rgba(20,24,36,.05), 0 8px 24px -12px rgba(20,24,36,.18);
  --radius:9px;
  --serif:'Noto Serif KR',ui-serif,serif;
  --sans:'Noto Sans KR','Noto Sans',-apple-system,sans-serif;
  --mono:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e6e8ee; --ink-soft:#a3aabb;
    --paper:#12151c; --surface:#191d26; --surface-2:#20242e;
    --line:#2b3140; --line-strong:#3a4152;
    --accent:#93a1ff; --accent-bg:#242a52;
    --ok:#57d19a; --ok-bg:#123527;
    --warn:#f0805e; --warn-bg:#3a1f16;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ink:#e6e8ee; --ink-soft:#a3aabb;
  --paper:#12151c; --surface:#191d26; --surface-2:#20242e;
  --line:#2b3140; --line-strong:#3a4152;
  --accent:#93a1ff; --accent-bg:#242a52;
  --ok:#57d19a; --ok-bg:#123527;
  --warn:#f0805e; --warn-bg:#3a1f16;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -12px rgba(0,0,0,.6);
}

*{box-sizing:border-box;}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7;padding:0 18px;}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;color:var(--ink);text-wrap:balance;margin:0;}
p{margin:0 0 12px;}
p:last-child{margin-bottom:0;}
a{color:var(--accent);}
code{font-family:var(--mono);}
::selection{background:var(--accent-bg);color:var(--accent);}

.wrap{max-width:940px;margin:0 auto;padding-block:26px 70px;}

/* ---- case header ---- */
.case-header{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:22px 26px;margin-bottom:18px;
}
.case-header .kicker{
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent);display:flex;align-items:center;gap:8px;margin-bottom:10px;
}
.case-header .kicker .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);}
.case-header h1{font-size:26px;line-height:1.3;margin-bottom:8px;}
.case-header .sub{color:var(--ink-soft);font-size:14px;max-width:60ch;margin-bottom:16px;}
.case-meta{display:flex;flex-wrap:wrap;gap:22px;border-top:1px solid var(--line);padding-top:14px;}
.case-meta div{font-size:12.5px;}
.case-meta dt{font-family:var(--mono);color:var(--ink-soft);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px;}
.case-meta dd{margin:0;font-weight:600;}

/* ---- tabs ---- */
nav.tabs{
  display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;margin-bottom:20px;
  -webkit-overflow-scrolling:touch;border-bottom:1px solid var(--line-strong);
}
nav.tabs button{
  all:unset;flex:none;cursor:pointer;
  font-family:var(--sans);font-size:13px;font-weight:500;color:var(--ink-soft);
  padding:10px 14px;border-bottom:2px solid transparent;white-space:nowrap;
  display:flex;align-items:baseline;gap:6px;
}
nav.tabs button .n{font-family:var(--serif);font-size:12px;color:var(--ink-soft);}
nav.tabs button:hover{color:var(--ink);}
nav.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent);}
nav.tabs button[aria-selected="true"] .n{color:var(--accent);}

/* ---- panels & entries ---- */
.panel{display:none;}
.panel[data-active="true"]{display:block;animation:fade .22s ease;}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.panel-head{margin-bottom:18px;}
.panel-head h2{font-size:23px;margin-bottom:6px;}
.panel-head .desc{color:var(--ink-soft);font-size:13.5px;max-width:64ch;}

.entry{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:19px 22px;margin-bottom:14px;
}
.entry > h3{font-size:15px;margin-bottom:4px;display:flex;align-items:center;gap:8px;}
.entry > .entry-label{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;display:block;}
.entry > h3 + .entry-label{margin-top:-2px;}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:720px){.grid-2{grid-template-columns:1fr;}}

table{width:100%;border-collapse:collapse;font-size:13.2px;}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;}
tr:last-child td{border-bottom:none;}
.tbl-wrap{overflow-x:auto;margin:8px 0;}

pre{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:13px 15px;overflow-x:auto;font-size:12px;line-height:1.6;margin:10px 0;}
pre code{font-family:var(--mono);color:var(--ink);}
.add{color:var(--ok);}
.del{color:var(--warn);text-decoration:line-through;text-decoration-color:var(--warn);}

.tag{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;}
.tag.ok{background:var(--ok-bg);color:var(--ok);}
.tag.warn{background:var(--warn-bg);color:var(--warn);}
.tag.neutral{background:var(--surface-2);color:var(--ink-soft);}

.callout{border-left:3px solid var(--accent);background:var(--accent-bg);padding:11px 15px;border-radius:0 8px 8px 0;font-size:13px;margin:12px 0;}
.callout.warn{border-color:var(--warn);background:var(--warn-bg);color:var(--warn);}
.callout.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);}

ol.steps{margin:8px 0 0;padding:0;list-style:none;counter-reset:s;}
ol.steps li{counter-increment:s;position:relative;padding-left:28px;margin-bottom:9px;font-size:13.2px;}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:.5px;width:19px;height:19px;border-radius:50%;background:var(--surface-2);color:var(--ink-soft);font-family:var(--mono);font-size:10.5px;font-weight:600;display:flex;align-items:center;justify-content:center;}
ul.plain{margin:8px 0 0;padding:0;list-style:none;}
ul.plain li{position:relative;padding-left:15px;margin-bottom:6px;font-size:13.2px;}
ul.plain li::before{content:"–";position:absolute;left:0;color:var(--ink-soft);}

dl.qa{margin:0;}
dl.qa dt{font-family:var(--serif);font-weight:600;font-size:14px;margin:16px 0 6px;}
dl.qa dt:first-child{margin-top:0;}
dl.qa dd{margin:0 0 4px;font-size:13.3px;color:var(--ink);}
dl.qa dd ul{margin:4px 0 0;padding-left:16px;}

figure{margin:14px 0 4px;}
figure svg{width:100%;height:auto;display:block;background:var(--surface);border:1px solid var(--line);border-radius:8px;}
figcaption{font-size:12px;color:var(--ink-soft);margin-top:7px;text-align:center;}

.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13.2px;}
.kv dt{color:var(--ink-soft);font-family:var(--mono);font-size:11px;padding-top:2px;}
.kv dd{margin:0;}

@media (max-width:600px){
  .case-meta{gap:14px;}
}
</style>

<div class="wrap">
  <header class="case-header">
    <div class="kicker"><span class="dot"></span>원인 확인 · 실 BTP 환경 재현·검증 완료</div>
    <h1>캐싱 버그 조사 기록</h1>
    <p class="sub">SK ON e-HR(<code>welfare</code>) 화이트스크린 현상 — 가설 수립부터 실제 배포 환경 대조 실험까지의 전체 조사 과정</p>
    <dl class="case-meta">
      <div><dt>대상</dt><dd>welfare (e-HR)</dd></div>
      <div><dt>재현 환경</dt><dd>BTP KR_pockr / dev</dd></div>
      <div><dt>재현 라운드</dt><dd>3회 (toy → BTP → hash routing)</dd></div>
      <div><dt>근본 원인</dt><dd>xs-app.json catch-all</dd></div>
    </dl>
  </header>

  <nav class="tabs" id="tabnav" role="tablist" aria-label="조사 기록 목차"></nav>
  <main id="content"></main>
</div>

<script>
const TABS = [
  {id:"overview", label:"개요 · 가설 수립"},
  {id:"toy", label:"1차 · 로컬 재현"},
  {id:"btp", label:"2차 · 실 BTP 재현"},
  {id:"conclusion", label:"결론"},
  {id:"qa", label:"캐시 개념 Q&A"},
  {id:"walkthrough", label:"슬로우 워크스루"},
  {id:"welfare", label:"3차 · welfare 실증"},
  {id:"perf", label:"성능 · 대안 비교"},
  {id:"todo", label:"남은 과제"},
  {id:"guide", label:"재현 가이드"},
];
const nav = document.getElementById("tabnav");
TABS.forEach((t,i)=>{
  const b = document.createElement("button");
  b.setAttribute("role","tab");
  b.dataset.tab = t.id;
  b.innerHTML = `<span class="n">${String(i+1).padStart(2,"0")}</span><span>${t.label}</span>`;
  b.addEventListener("click", ()=>select(t.id));
  nav.appendChild(b);
});
function select(id){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===id));
  document.querySelectorAll(".panel").forEach(p=>p.dataset.active = (p.id==="panel-"+id));
  try{ localStorage.setItem("ehr-log-tab", id); }catch(e){}
  window.scrollTo({top:0, behavior:"instant"});
}
let initial = "overview";
try{ initial = localStorage.getItem("ehr-log-tab") || "overview"; }catch(e){}
if(!TABS.find(t=>t.id===initial)) initial = "overview";
</script>

<div id="panels"></div>

<!-- ============ 1. 개요 ============ -->
<template id="tmpl-overview">
<div class="panel" id="panel-overview">
  <div class="panel-head"><h2>배경과 가설 수립</h2>
    <p class="desc">SK ON e-HR 시스템의 간헐적 흰 화면 현상 — 조사의 출발점과 초기 가설 4가지.</p>
  </div>

    <p>"메뉴 클릭 후 흰 화면, 일정 시간 후 또는 브라우저 캐시 전체 삭제 후 정상화"되는 현상이 불특정 사용자에게 간헐적으로 발생. 1년 전 유사 이슈(브라우저 재시작 후 인증 실패)는 <code>xs-app.json</code>의 welcome file(<code>index.html</code>)에 <code>cacheControl</code> 설정을 추가해 해결한 전례가 있음.</p>
  </div>

  <div class="entry">
    <h3>조사 여정</h3>

        <!-- nodes -->
        <g font-family="Noto Sans KR, sans-serif" font-size="11">
          <!-- 1 -->
          <circle cx="70" cy="95" r="5" fill="var(--ink-soft)"/>
          <text x="70" y="75" text-anchor="middle" fill="currentColor">배경 파악</text>
          <text x="70" y="118" text-anchor="middle" fill="var(--ink-soft)" font-size="10">간헐적 흰 화면</text>
          <!-- 2 -->
          <circle cx="200" cy="95" r="5" fill="var(--ink-soft)"/>
          <text x="200" y="75" text-anchor="middle" fill="currentColor">가설 4개</text>
          <text x="200" y="118" text-anchor="middle" fill="var(--ink-soft)" font-size="10">타임아웃 · 캐시 · 등</text>
          <!-- 3 -->
          <circle cx="330" cy="95" r="5" fill="var(--ink-soft)"/>
          <text x="330" y="75" text-anchor="middle" fill="currentColor">SAP 자료 조사</text>
          <text x="330" y="118" text-anchor="middle" fill="var(--ink-soft)" font-size="10">Help · KBA</text>
          <!-- 4 -->
          <circle cx="460" cy="95" r="6.5" fill="var(--accent)"/>
          <text x="460" y="75" text-anchor="middle" fill="var(--accent)" font-weight="700">1차 로컬 재현</text>
          <text x="460" y="118" text-anchor="middle" fill="var(--ink-soft)" font-size="10">toy 서버</text>
          <!-- 5 -->
          <circle cx="590" cy="95" r="7.5" fill="var(--accent)"/>
          <text x="590" y="75" text-anchor="middle" fill="var(--accent)" font-weight="700">2차 실 BTP 재현</text>
          <text x="590" y="118" text-anchor="middle" fill="var(--ink-soft)" font-size="10">A/B 대조 실험</text>
          <!-- 6 -->
          <circle cx="720" cy="95" r="6.5" fill="var(--accent)"/>
          <text x="720" y="75" text-anchor="middle" fill="var(--accent)" font-weight="700">실제 설정 확인</text>
          <text x="720" y="118" text-anchor="middle" fill="var(--ink-soft)" font-size="10">welfare xs-app.json</text>
          <!-- 7 -->
          <circle cx="850" cy="95" r="7.5" fill="var(--ok)"/>
          <text x="850" y="75" text-anchor="middle" fill="var(--ok)" font-weight="700">3차 정밀 재현</text>
          <text x="850" y="118" text-anchor="middle" fill="var(--ink-soft)" font-size="10">해시 라우팅</text>
        </g>
        <text x="450" y="160" text-anchor="middle" font-family="Noto Sans KR, sans-serif" font-size="11.5" fill="var(--ink-soft)">굵은 원 = 실제 배포/재현 실행 지점</text>
      </svg>
      <figcaption>4개 가설에서 출발해 세 차례의 실증(로컬 → 실 BTP → 실제 소스 기반 정밀 재현)으로 신뢰도를 높여간 조사 흐름.</figcaption>

  <div class="entry">

        <tr><td>2</td><td><b>HTML5 앱 정적 리소스의 xs-app.json 캐시 정책 커버리지 불균일</b></td><td><span class="tag ok">1순위 — 확정</span></td></tr>
        <tr><td>3</td><td>Work Zone 사이트 타일의 sap-ui-version 고정 (KBA 3703606)</td><td><span class="tag neutral">미착수</span></td></tr>
        <tr><td>4</td><td>Destination(OAuth2UserTokenExchange) 토큰 캐시 TTL 불일치</td><td><span class="tag neutral">미착수</span></td></tr>
      </tbody>
    </table>
    </div>
  </div>

  <div class="grid-2">
    <div class="entry">
      <span class="entry-label">SAP 공식 자료 조사</span>
      <ul class="plain">
        <li>SAPUI5 앱 리소스는 기본 최대 1년 브라우저 캐시됨</li>
        <li>Cache Buster는 ABAP NetWeaver 전용 (BTP CF 미적용)</li>
        <li>KBA 3703606 — Work Zone 타일 버전 고정 시 blank screen</li>

    <div class="entry">
      <span class="entry-label">고객 콘솔 로그 분리 분석</span>

    </div>
  </div>
</div>
</template>

<!-- ============ 2. 로컬 재현 ============ -->
<template id="tmpl-toy">
<div class="panel" id="panel-toy">
  <div class="panel-head"><h2>1차 · 로컬 Toy Demo 재현</h2>
    <p class="desc">가설을 축소 모형으로 빠르게 검증한 첫 단계.</p>
  </div>
  <div class="entry">
    <h3>구성</h3>
    <p>Node.js 정적 서버로 welcome file(항상 fresh) + 메뉴 리소스(캐시 정책 유무를 전환 가능하게 구성)를 흉내낸 축소 모형 제작 (<code>repro/</code> 폴더).</p>
  </div>
  <div class="grid-2">
    <div class="entry">
      <span class="entry-label">캐시 정책 없음</span>
      <p>배포 후 흰 화면 재현 성공 — 구버전 JS가 신버전 셸 데이터 형상을 못 읽어 <code>TypeError</code> 발생.</p>
    </div>
    <div class="entry">
      <span class="entry-label"><code>cacheControl</code> 적용</span>
      <p>흰 화면 재발 없음, 정상 반영 확인.</p>
    </div>
  </div>
  <div class="entry">
    <div class="callout warn"><b>부수적 발견</b> — 이미 캐시가 오염된 사용자는 서버 설정만 바꿔도 소급 적용되지 않음. 헤더 정책 변경은 향후 요청에만 영향을 주고, 과거 캐시 엔트리는 그대로 유지됨.</div>
  </div>
</div>
</template>

<!-- ============ 3. 실 BTP 재현 ============ -->
<template id="tmpl-btp">
<div class="panel" id="panel-btp">
  <div class="panel-head"><h2>2차 · 실 BTP CF 환경 재현</h2>
    <p class="desc">SK ON과 동일한 아키텍처(CAP+Fiori+AppRouter+XSUAA+html5-apps-repo, <code>demo01</code>)를 실제 BTP dev subaccount(org <code>BTP KR_pockr</code> / space <code>dev</code>)에 배포하여 재현. 본 조사의 핵심 라운드.</p>
  </div>

  <div class="entry">
    <h3>배포 과정에서 만난 이슈 (캐싱과 무관, 별도 처리)</h3>
    <div class="tbl-wrap">
    <table>

    <p>사용자 제안에 따라 <code>webapp/crashtest.html</code> + <code>crashtest.js</code> 신규 추가 — v1은 <code>ctx.empNo</code>, v2("배포 후")는 셸·JS 동시에 <code>ctx.employeeNumber</code>로 변경해 구버전 JS가 캐시에 남고 셸만 새로 받는 상황 재현.</p>

<!-- ============ 5. Q&A ============ -->
<template id="tmpl-qa">
<div class="panel" id="panel-qa">
  <div class="panel-head"><h2>캐시 개념 Q&A</h2>
    <p class="desc">조사 진행 중 정리된 HTTP 캐시 개념 문답 모음.</p>
  </div>
  <div class="entry">
    <dl class="qa">
      <dt>no-store / no-cache / must-revalidate 차이는?</dt>
      <dd><ul>
        <li><code>no-store</code> — 캐시에 저장 자체를 하지 마라</li>
        <li><code>no-cache</code> — 저장은 하되, 쓰기 전에 매번 서버에 재검증해라</li>
        <li><code>must-revalidate</code> — 유효기간(max-age)이 지난 뒤에만 강제로 재확인해라 (네트워크 장애 시 "그냥 옛날 거 쓰기" 예외를 금지)</li>
      </ul></dd>

      <dt>no-store와 no-cache를 같이 쓸 수 있나?</dt>
      <dd>문법적으로 모순 없음. <code>no-store</code>가 저장 자체를 막아 <code>no-cache</code>가 적용될 상황 자체가 안 생김 — 사실상 중복이지만, 구현 편차에 대비한 이중 안전장치로 실무에서 흔히 같이 씀.</dd>

      <dt>disk cache와 memory cache 차이는?</dt>
      <dd>memory cache는 세션 동안 메모리에 들고 있는 것(탭 닫으면 사라짐), disk cache는 디스크에 저장(재시작해도 남음). 둘 다 서버 재확인 없이 그대로 재사용함 — Network 탭에 <code>(disk cache)</code>/<code>(memory cache)</code>로 표시, 실제 다운로드 크기가 아님.</dd>

      <dt>cacheControl을 아예 안 쓰면 어떻게 되나?</dt>
      <dd>브라우저 자체 휴리스틱(Last-Modified 기준 경과시간 비율)으로 캐시 여부/기간을 추정 — 시점에 따라 들쭉날쭉해서 예측 불가능. 실제 "간헐적" 증상 패턴과 일치.</dd>

      <dt>이 휴리스틱이 브라우저마다 다른가?</dt>
      <dd>HTTP 표준은 "써도 된다"고만 하고 정확한 공식은 강제하지 않아 Chrome/Edge, Firefox, Safari가 각자 다르게 구현함. cacheControl을 명시하면 이 편차 자체가 무의미해짐.</dd>
    </dl>
  </div>
</div>
</template>

<!-- ============ 8. 성능 ============ -->
<template id="tmpl-perf">
<div class="panel" id="panel-perf">
  <div class="panel-head"><h2>성능 고려사항 및 대안 비교</h2>
    <p class="desc">수정안을 실제 반영하기 전 검토한 성능 트레이드오프.</p>
  </div>

  <div class="entry">
    <h3><code>no-store</code> 적용 시 성능 영향</h3>
    <p>catch-all에 걸리는 모든 리소스가 캐시 혜택을 전혀 못 받음 — 매 로드마다 안 바뀐 파일도 전부 재다운로드. 다만 트래픽이 크지 않은 사내 앱 환경에서는 실제 영향이 제한적일 가능성이 높고, "매번 흰 화면"의 비용이 "매번 조금 더 로딩"보다 훨씬 큼.</p>
  </div>

  <div class="entry">
    <h3>기각한 대안 — "문제되는 XML/메뉴만 선택적으로 no-cache"</h3>
    <ol class="steps">
      <li>다음에 "문제될 파일"을 미리 알 수 없음 — 매번 화이트리스트를 사후 관리하는 두더지잡기(whack-a-mole)가 됨</li>
      <li>번들링된 경우 애초에 선택 불가 — 여러 메뉴가 Component-preload.js 하나로 뭉쳐있으면 일부만 다른 캐시 정책을 줄 방법이 없음</li>
      <li>관리 부담 증가 — 메뉴 추가/변경마다 xs-app.json도 같이 유지보수해야 함</li>
    </ol>
  </div>

  <div class="entry">
    <h3>더 나은 절충안 — <code>no-cache</code> + ETag</h3>
    <p>파일이 안 바뀌었으면 서버가 <code>304 Not Modified</code>로 응답해 캐시를 재사용(빠름), 바뀌었을 때만 새로 다운로드 — 이상적인 절충안.</p>
    <div class="callout warn"><b>실측에서 발견한 함정</b> — <code>&lt;script src&gt;</code> 태그로 로드되는 리소스는 <code>no-cache</code>만으로는 재검증 자체를 안 타는 현상을 확인함 (그래서 최종적으로 <code>no-store</code>로 처리). 적용 전 반드시 실측 테스트 필요.</div>
  </div>

  <div class="grid-2">
    <div class="entry">
      <span class="entry-label">중장기 이상적 해법</span>
      <p style="font-size:13.3px">content-hash 파일명 전략 — 배포마다 URL 자체가 바뀌게 해서 <code>max-age</code>를 길게 걸어도 안전. 빌드/배포 파이프라인 구조 변경 필요.</p>
    </div>
    <div class="entry">
      <span class="entry-label">권장 순서</span>
      <ol class="steps" style="margin-top:2px">
        <li>단기: no-store 반영</li>
        <li>중기: no-cache+ETag 실측 후 전환</li>
        <li>장기: content-hash 전략 검토</li>
      </ol>
    </div>
  </div>
</div>
